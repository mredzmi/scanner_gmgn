<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GMGN AI Scanner</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#090b10;color:#f5f7fb}main{max-width:760px;margin:auto;padding:28px 18px 60px}.brand{font-size:25px;font-weight:800;margin-bottom:6px}.sub{color:#8992a3;margin-bottom:24px}.card{background:#11151d;border:1px solid #222936;border-radius:18px;padding:18px;margin:14px 0}.row{display:flex;gap:10px}.input{flex:1;background:#0b0e14;border:1px solid #303846;border-radius:12px;color:white;padding:14px;font-size:15px}.btn{border:0;border-radius:12px;padding:0 18px;font-weight:800;cursor:pointer;background:#fff;color:#090b10}.btn:disabled{opacity:.5}.score{font-size:58px;font-weight:900;line-height:1}.pill{display:inline-block;padding:6px 10px;border-radius:999px;font-weight:800;font-size:12px;margin-top:8px;background:#252b35}.green{color:#72e6a0}.yellow{color:#ffd76a}.red{color:#ff7777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#0b0e14;border-radius:12px;padding:13px}.metric b{display:block;font-size:18px;margin-top:4px}.muted{color:#8992a3;font-size:12px}.signal{display:flex;justify-content:space-between;border-bottom:1px solid #202631;padding:12px 0}.signal:last-child{border:0}.error{color:#ff7777}.small{font-size:13px;color:#aab2c0;line-height:1.55}.hidden{display:none}@media(max-width:560px){.row{flex-direction:column}.btn{height:48px}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main>
<div class="brand">⚡ GMGN AI Scanner</div><div class="sub">Solana token risk & momentum scanner</div>
<div class="card"><div class="row"><input id="ca" class="input" placeholder="Paste Solana contract address…" autocomplete="off"><button id="scan" class="btn">Analyse</button></div><div id="status" class="small" style="margin-top:10px"></div></div>
<div id="result" class="hidden">
<div class="card"><div class="muted">AI SCORE</div><div id="score" class="score">—</div><div id="verdict" class="pill">—</div><p id="summary" class="small"></p></div>
<div class="card"><div class="grid"><div class="metric"><span class="muted">Market Cap</span><b id="mc">—</b></div><div class="metric"><span class="muted">Liquidity</span><b id="liq">—</b></div><div class="metric"><span class="muted">Volume 24H</span><b id="vol">—</b></div><div class="metric"><span class="muted">Price Change 24H</span><b id="chg">—</b></div></div></div>
<div class="card"><h3 style="margin-top:0">Signal breakdown</h3><div id="signals"></div></div>
<div class="card"><h3 style="margin-top:0">Risk notes</h3><div id="risks" class="small"></div></div>
</div></main>
<script>
const $=id=>document.getElementById(id); const fmt=n=>{if(n==null||!isFinite(n))return '—'; if(Math.abs(n)>=1e9)return '$'+(n/1e9).toFixed(2)+'B'; if(Math.abs(n)>=1e6)return '$'+(n/1e6).toFixed(2)+'M'; if(Math.abs(n)>=1e3)return '$'+(n/1e3).toFixed(1)+'K'; return '$'+n.toFixed(2)};
function validSolana(x){return /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(x)}
async function scan(){let ca=$('ca').value.trim(); $('result').classList.add('hidden'); if(!validSolana(ca)){ $('status').innerHTML='<span class="error">Enter a valid-looking Solana contract address.</span>'; return;} $('scan').disabled=true;$('status').textContent='Fetching live market data…'; try{let r=await fetch('https://api.dexscreener.com/latest/dex/tokens/'+encodeURIComponent(ca)); if(!r.ok)throw Error('Market API error'); let d=await r.json(); let pairs=(d.pairs||[]).filter(p=>p.chainId==='solana'); if(!pairs.length)throw Error('No Solana pair found. Token may be too new or unsupported.'); pairs.sort((a,b)=>(b.liquidity?.usd||0)-(a.liquidity?.usd||0)); let p=pairs[0], score=calc(p,pairs), risk=[]; if((p.liquidity?.usd||0)<10000)risk.push('Low liquidity — exits may be difficult.'); if((p.volume?.h24||0)<10000)risk.push('Low 24H volume.'); if(Math.abs(p.priceChange?.h24||0)>80)risk.push('Extreme 24H price movement.'); if(p.txns?.h24){let buys=p.txns.h24.buys||0,sells=p.txns.h24.sells||0;if(sells>buys*1.5)risk.push('Sell pressure is materially higher than buys.');} if(!risk.length)risk.push('No obvious market-structure warning from the available data. This is not a safety guarantee.');
$('score').textContent=score; $('score').className='score '+(score>=80?'green':score>=60?'yellow':'red'); let verdict=score>=80?'BUY WATCH':score>=60?'WATCH':'AVOID'; $('verdict').textContent=verdict; $('verdict').className='pill '+(score>=80?'green':score>=60?'yellow':'red'); $('mc').textContent=fmt(p.marketCap||p.fdv);$('liq').textContent=fmt(p.liquidity?.usd);$('vol').textContent=fmt(p.volume?.h24);$('chg').textContent=(p.priceChange?.h24??0).toFixed(1)+'%'; $('summary').textContent=`${p.baseToken?.name||'Token'} (${p.baseToken?.symbol||'?'}) on ${p.dexId||'DEX'}. Score is a rule-based screening signal using live market structure; it is not financial advice.`;
let buys=p.txns?.h24?.buys||0,sells=p.txns?.h24?.sells||0; let liq=p.liquidity?.usd||0,vol=p.volume?.h24||0,chg=p.priceChange?.h24||0; $('signals').innerHTML=[['Liquidity',Math.min(20,Math.round(liq/25000*20)),liq>=25000?'Healthy':'Weak'],['Volume',Math.min(20,Math.round(vol/50000*20)),vol>=50000?'Active':'Thin'],['Buy pressure',Math.min(20,Math.round((buys/(buys+sells||1))*20)),buys>=sells?'Positive':'Negative'],['Momentum',Math.min(20,Math.max(0,Math.round((chg+20)/4))),chg>0?'Positive':'Negative'],['Market depth',Math.min(20,pairs.length>=3?18:12),pairs.length>=3?'Multiple pairs':'Limited pairs']].map(x=>`<div class="signal"><span>${x[0]}<br><span class="muted">${x[2]}</span></span><b>${x[1]}/20</b></div>`).join(''); $('risks').innerHTML=risk.map(x=>'• '+x).join('<br>'); $('result').classList.remove('hidden');$('status').textContent='Live scan complete.'; }catch(e){$('status').innerHTML='<span class="error">'+e.message+'</span>';}finally{$('scan').disabled=false}}
function calc(p,pairs){let s=0,liq=p.liquidity?.usd||0,vol=p.volume?.h24||0,chg=p.priceChange?.h24||0,buys=p.txns?.h24?.buys||0,sells=p.txns?.h24?.sells||0;s+=Math.min(20,liq/25000*20);s+=Math.min(20,vol/50000*20);s+=20*(buys/(buys+sells||1));s+=Math.min(20,Math.max(0,(chg+20)/4));s+=Math.min(20,pairs.length>=3?18:12);return Math.round(Math.max(0,Math.min(100,s)))}$('scan').onclick=scan;$('ca').addEventListener('keydown',e=>{if(e.key==='Enter')scan()});
</script></body></html>
