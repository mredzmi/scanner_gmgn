<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GMGN AI Scanner</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#090b10;color:#f5f7fb}main{max-width:760px;margin:auto;padding:28px 18px 60px}.brand{font-size:25px;font-weight:800}.sub,.muted{color:#8992a3}.sub{margin:6px 0 24px}.card{background:#11151d;border:1px solid #222936;border-radius:18px;padding:18px;margin:14px 0}.row{display:flex;gap:10px}.input{flex:1;background:#0b0e14;border:1px solid #303846;border-radius:12px;color:white;padding:14px;font-size:15px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer;background:#fff;color:#090b10}.btn.secondary{background:#252b35;color:#fff;margin-top:10px;width:100%}.btn:disabled{opacity:.5}.score{font-size:58px;font-weight:900;line-height:1}.pill{display:inline-block;padding:6px 10px;border-radius:999px;font-weight:800;font-size:12px;margin-top:8px;background:#252b35}.green{color:#72e6a0}.yellow{color:#ffd76a}.red{color:#ff7777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#0b0e14;border-radius:12px;padding:13px}.metric b{display:block;font-size:18px;margin-top:4px}.signal{display:flex;justify-content:space-between;border-bottom:1px solid #202631;padding:12px 0}.signal:last-child{border:0}.small{font-size:13px;color:#aab2c0;line-height:1.55}.hidden{display:none}.xgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.xbox{background:#0b0e14;border-radius:12px;padding:12px;text-align:center}.xbox b{display:block;font-size:18px;margin-top:4px}@media(max-width:560px){.row{flex-direction:column}.grid{grid-template-columns:1fr 1fr}.xgrid{grid-template-columns:1fr 1fr}}</style></head><body><main><div class="brand">⚡ GMGN AI Scanner</div><div class="sub">Solana token risk & momentum scanner</div><div class="card"><div class="row"><input id="ca" class="input" placeholder="Paste Solana contract address…" autocomplete="off"><button id="scan" class="btn">Analyse</button></div><div id="status" class="small" style="margin-top:10px"></div></div><div id="result" class="hidden"><div class="card"><div class="muted">AI SCORE</div><div id="score" class="score">—</div><div id="verdict" class="pill">—</div><p id="summary" class="small"></p><button id="reset" class="btn secondary">↻ New Scan / Reset</button></div><div class="card"><div class="grid"><div class="metric"><span class="muted">Market Cap</span><b id="mc">—</b></div><div class="metric"><span class="muted">Liquidity</span><b id="liq">—</b></div><div class="metric"><span class="muted">Volume 24H</span><b id="vol">—</b></div><div class="metric"><span class="muted">Price 24H</span><b id="chg">—</b></div></div></div><div class="card"><h3 style="margin-top:0">🚀 Pump Potential</h3><div id="pump" class="small"></div><div class="xgrid" style="margin-top:12px"><div class="xbox"><span class="muted">2X</span><b id="x2">—</b></div><div class="xbox"><span class="muted">5X</span><b id="x5">—</b></div><div class="xbox"><span class="muted">10X</span><b id="x10">—</b></div><div class="xbox"><span class="muted">20X</span><b id="x20">—</b></div></div></div><div class="card"><h3 style="margin-top:0">Signal breakdown</h3><div id="signals"></div></div><div class="card"><h3 style="margin-top:0">Risk notes</h3><div id="risks" class="small"></div></div></div></main><script>const $=id=>document.getElementById(id);const fmt=n=>{if(n==null||!isFinite(n))return'—';if(Math.abs(n)>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(Math.abs(n)>=1e6)return'$'+(n/1e6).toFixed(2)+'M';if(Math.abs(n)>=1e3)return'$'+(n/1e3).toFixed(1)+'K';return'$'+n.toFixed(2)};const mcFmt=n=>n>=1e9?'$'+(n/1e9).toFixed(2)+'B':n>=1e6?'$'+(n/1e6).toFixed(2)+'M':n>=1e3?'$'+(n/1e3).toFixed(0)+'K':'$'+n.toFixed(0);function validSolana(x){return/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(x)}function reset(){ $('ca').value='';$('status').textContent='';$('result').classList.add('hidden');$('ca').focus();window.scrollTo({top:0,behavior:'smooth'})}function potential(score,liq,vol,chg){let p=score;if(liq<25000)p-=10;if(vol<50000)p-=10;if(chg>50)p-=8;return Math.max(0,Math.min(100,p))}function calc(p,pairs){let liq=p.liquidity?.usd||0,vol=p.volume?.h24||0,chg=p.priceChange?.h24||0,b=p.txns?.h24?.buys||0,s=p.txns?.h24?.sells||0;return Math.round(Math.max(0,Math.min(100),Math.min(20,liq/25000*20)+Math.min(20,vol/50000*20)+20*(b/(b+s||1))+Math.min(20,Math.max(0,(chg+20)/4))+Math.min(20,pairs.length>=3?18:12)))}async function scan(){let ca=$('ca').value.trim();$('result').classList.add('hidden');if(!validSolana(ca)){$('status').innerHTML='<span class="red">Enter a valid-looking Solana contract address.</span>';return}$('scan').disabled=true;$('status').textContent='Fetching live market data…';try{let r=await fetch('https://api.dexscreener.com/latest/dex/tokens/'+encodeURIComponent(ca));if(!r.ok)throw Error('Market API error');let d=await r.json(),pairs=(d.pairs||[]).filter(p=>p.chainId==='solana');if(!pairs.length)throw Error('No Solana pair found. Token may be too new or unsupported.');pairs.sort((a,b)=>(b.liquidity?.usd||0)-(a.liquidity?.usd||0));let p=pairs[0],score=calc(p,pairs),liq=p.liquidity?.usd||0,vol=p.volume?.h24||0,chg=p.priceChange?.h24||0,b=p.txns?.h24?.buys||0,s=p.txns?.h24?.sells||0,risks=[];if(liq<10000)risks.push('Very low liquidity — exits may be difficult.');else if(liq<25000)risks.push('Low liquidity.');if(vol<10000)risks.push('Very low 24H volume.');if(Math.abs(chg)>80)risks.push('Extreme 24H price movement.');if(s>b*1.5)risks.push('Sell pressure materially exceeds buys.');if(!risks.length)risks.push('No obvious market-structure warning from available data.');let pot=potential(score,liq,vol,chg);let verdict=score>=80?'BUY WATCH':score>=60?'WATCH':'AVOID';$('score').textContent=score;$('score').className='score '+(score>=80?'green':score>=60?'yellow':'red');$('verdict').textContent=verdict;$('verdict').className='pill '+(score>=80?'green':score>=60?'yellow':'red');$('mc').textContent=fmt(p.marketCap||p.fdv);$('liq').textContent=fmt(liq);$('vol').textContent=fmt(vol);$('chg').textContent=chg.toFixed(1)+'%';$('summary').textContent=`${p.baseToken?.name||'Token'} (${p.baseToken?.symbol||'?'}) on ${p.dexId||'DEX'}. Rule-based screening from live market data; not financial advice.`;let m=p.marketCap||p.fdv||0;$('pump').innerHTML=`<b>${pot>=80?'🔥 High':pot>=65?'🟡 Moderate':'🔴 Low'} potential</b> — score ${pot}/100. X scenarios are market-cap scenarios, not predictions.`;[['x2',2],['x5',5],['x10',10],['x20',20]].forEach(([id,x])=>$(id).textContent=m?mcFmt(m*x):'—');$('signals').innerHTML=[['Liquidity',Math.min(20,Math.round(liq/25000*20)),liq>=25000?'Healthy':'Weak'],['Volume',Math.min(20,Math.round(vol/50000*20)),vol>=50000?'Active':'Thin'],['Buy pressure',Math.min(20,Math.round((b/(b+s||1))*20)),b>=s?'Positive':'Negative'],['Momentum',Math.min(20,Math.max(0,Math.round((chg+20)/4))),chg>0?'Positive':'Negative'],['Market depth',Math.min(20,pairs.length>=3?18:12),pairs.length>=3?'Multiple pairs':'Limited pairs']].map(x=>`<div class="signal"><span>${x[0]}<br><span class="muted">${x[2]}</span></span><b>${x[1]}/20</b></div>`).join('');$('risks').innerHTML=risks.map(x=>'• '+x).join('<br>');$('result').classList.remove('hidden');$('status').textContent='Live scan complete.'}catch(e){$('status').innerHTML='<span class="red">'+e.message+'</span>'}finally{$('scan').disabled=false}}$('scan').onclick=scan;$('reset').onclick=reset;$('ca').addEventListener('keydown',e=>{if(e.key==='Enter')scan()});</script></body></html>
