<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GMGN AI Scanner V2</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#080a0f;color:#f5f7fb}main{max-width:780px;margin:auto;padding:24px 16px 60px}.brand{font-size:25px;font-weight:900}.sub{color:#8d96a6;margin:5px 0 22px}.card{background:#11151d;border:1px solid #252c38;border-radius:18px;padding:17px;margin:12px 0}.row{display:flex;gap:9px}.input{flex:1;background:#0b0e14;border:1px solid #343c49;border-radius:12px;color:#fff;padding:14px}.btn{background:#fff;color:#080a0f;border:0;border-radius:12px;padding:13px 17px;font-weight:800}.secondary{background:#272e39;color:#fff;width:100%;margin-top:10px}.hidden{display:none}.muted,.small{color:#98a1b1}.small{font-size:13px;line-height:1.55}.score{font-size:58px;font-weight:900}.green{color:#65e59a}.yellow{color:#ffd466}.orange{color:#ffad66}.red{color:#ff7272}.pill{display:inline-block;border-radius:99px;padding:6px 11px;background:#252c37;font-weight:800;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metric,.xbox{background:#0b0e14;border-radius:12px;padding:12px}.metric b{display:block;font-size:18px;margin-top:4px}.signals{display:grid;grid-template-columns:1fr 1fr;gap:8px}.signal{background:#0b0e14;border-radius:12px;padding:11px}.signal b{display:block;margin-top:3px}.xgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}.xbox{text-align:center}.xbox b{display:block;margin-top:4px}.risk{padding:10px 0;border-bottom:1px solid #242a34}.risk:last-child{border:0}@media(max-width:560px){.row{flex-direction:column}.xgrid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><div class="brand">⚡ GMGN AI Scanner V2</div><div class="sub">Market + risk + holder intelligence</div><div class="card"><div class="row"><input id="ca" class="input" placeholder="Paste token contract…"><button id="scan" class="btn">Analyse</button></div><div id="status" class="small" style="margin-top:9px"></div></div><section id="result" class="hidden"><div class="card"><div class="muted">OVERALL SCORE</div><div id="score" class="score">—</div><div id="grade" class="pill">—</div><p id="verdict" class="small"></p><button id="reset" class="btn secondary">↻ New Scan / Reset</button></div><div class="card"><div class="grid"><div class="metric"><span class="muted">Chain</span><b id="chain">—</b></div><div class="metric"><span class="muted">Market Cap</span><b id="mc">—</b></div><div class="metric"><span class="muted">Liquidity</span><b id="liq">—</b></div><div class="metric"><span class="muted">Volume 24H</span><b id="vol">—</b></div></div></div><div class="card"><h3>🚀 Pump Potential</h3><div id="pump" class="small"></div><div class="xgrid"><div class="xbox">2X<b id="x2">—</b></div><div class="xbox">5X<b id="x5">—</b></div><div class="xbox">10X<b id="x10">—</b></div><div class="xbox">20X<b id="x20">—</b></div><div class="xbox">100X<b id="x100">—</b></div></div></div><div class="card"><h3>🧠 Signal Breakdown</h3><div id="signals" class="signals"></div></div><div class="card"><h3>🛡️ Risk</h3><div id="risks" class="small"></div></div><div class="card"><h3>🤖 Analysis</h3><div id="ai" class="small"></div></div></section></main><script>const $=x=>document.getElementById(x),fmt=n=>{if(!isFinite(n)||n==null)return'—';return n>=1e9?'$'+(n/1e9).toFixed(2)+'B':n>=1e6?'$'+(n/1e6).toFixed(2)+'M':n>=1e3?'$'+(n/1e3).toFixed(1)+'K':'$'+n.toFixed(0)},valid=x=>x.length>=32&&x.length<=44,chainName=x=>({solana:'Solana',ethereum:'Ethereum',bsc:'BNB Chain',base:'Base',arbitrum:'Arbitrum',polygon:'Polygon',avalanche:'Avalanche',optimism:'Optimism',hyperliquid:'HyperEVM'}[x]||x||'Unknown'),kind=a=>/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a)?'solana':/^0x[a-fA-F0-9]{40}$/.test(a)?'evm':'bad';function reset(){$('ca').value='';$('status').textContent='';$('result').classList.add('hidden');$('ca').focus()}function calc(p,pairs){let l=p.liquidity?.usd||0,v=p.volume?.h24||0,c=p.priceChange?.h24||0,b=p.txns?.h24?.buys||0,s=p.txns?.h24?.sells||0,t=b+s||1;let ls=Math.min(20,20*l/100000),vs=Math.min(20,20*v/250000),bs=20*b/t,ms=c<0?Math.max(0,10+c/2):Math.min(20,10+c/5),ds=pairs.length>=5?20:pairs.length>=3?16:pairs.length>=2?12:7,raw=ls+vs+bs+ms+ds;if(l<10000)raw-=12;else if(l<25000)raw-=6;if(v<10000)raw-=10;if(s>b*1.7&&b+s)raw-=8;if(c>100)raw-=5;return{score:Math.round(Math.max(0,Math.min(100,raw))),ls,vs,bs,ms,ds}}function grade(s){return s>=90?['A+','green','EXCEPTIONAL']:s>=80?['A','green','STRONG SETUP']:s>=70?['B','green','GOOD SETUP']:s>=60?['C','yellow','WATCH']:s>=40?['D','orange','HIGH RISK']:['F','red','AVOID']}async function scan(){let a=$('ca').value.trim();if(kind(a)==='bad'){$('status').innerHTML='<span class="red">Enter a valid Solana or EVM contract address.</span>';return}$('scan').disabled=true;$('status').textContent='Scanning live market data…';try{let r=await fetch('https://api.dexscreener.com/latest/dex/tokens/'+encodeURIComponent(a));if(!r.ok)throw Error('Market API error');let d=await r.json(),pairs=(d.pairs||[]);if(kind(a)==='solana')pairs=pairs.filter(p=>p.chainId==='solana');if(!pairs.length)throw Error('No supported trading pair found.');pairs.sort((a,b)=>(b.liquidity?.usd||0)-(a.liquidity?.usd||0));let p=pairs[0],q=calc(p,pairs),l=p.liquidity?.usd||0,v=p.volume?.h24||0,c=p.priceChange?.h24||0,b=p.txns?.h24?.buys||0,s=p.txns?.h24?.sells||0,m=p.marketCap||p.fdv||0,risks=[];if(l<10000)risks.push('🔴 Very low liquidity — exit may be difficult.');else if(l<25000)risks.push('🟡 Low liquidity.');if(v<10000)risks.push('🟡 Thin 24H volume.');if(c>150)risks.push('🟠 Extreme recent pump — entry may be late.');if(s>b*1.5&&b+s)risks.push('🔴 Sell pressure exceeds buys.');if(!risks.length)risks.push('🟢 No obvious market-structure red flag from available DEX data.');let s0=q.score,pot=Math.max(0,Math.min(100,s0-(l<25000?10:0)-(v<50000?10:0)-(c>50?8:0))),g=grade(s0);$('score').textContent=s0;$('score').className='score '+g[1];$('grade').textContent=g[0]+' · '+g[2];$('grade').className='pill '+g[1];$('chain').textContent=chainName(p.chainId);$('mc').textContent=fmt(m);$('liq').textContent=fmt(l);$('vol').textContent=fmt(v);$('verdict').textContent=s0>=80?'Signal: WATCH / possible entry setup — verify risks first.':s0>=60?'Signal: WAIT / WATCH — needs confirmation.':'Signal: AVOID until risk/reward improves.';$('pump').innerHTML=`<b>${pot>=80?'🔥 High':pot>=65?'🟡 Moderate':'🔴 Low'} potential</b> — ${pot}/100. Scenario only, not a prediction.`;[['x2',2],['x5',5],['x10',10],['x20',20],['x100',100]].forEach(([id,x])=>$(id).textContent=m?fmt(m*x):'—');$('signals').innerHTML=[['Liquidity',q.ls,l>=25000?'Healthy':'Weak'],['Volume',q.vs,v>=50000?'Active':'Thin'],['Buy pressure',q.bs,b>=s?'Positive':'Negative'],['Momentum',q.ms,c>0?'Positive':'Negative'],['Market depth',q.ds,pairs.length>=3?'Multiple pairs':'Limited']].map(x=>`<div class="signal"><span class="muted">${x[0]}</span><b>${Math.round(x[1])}/20</b><small>${x[2]}</small></div>`).join('');$('risks').innerHTML=risks.map(x=>'<div class="risk">'+x+'</div>').join('');$('ai').textContent=`${p.baseToken?.name||'Token'} (${p.baseToken?.symbol||'?'}) on ${chainName(p.chainId)} via ${p.dexId||'DEX'}. Score uses live liquidity, volume, buy/sell flow, momentum and market depth. Holder, smart-money and contract-level checks require chain-specific on-chain data; this version does not fabricate them.`;$('result').classList.remove('hidden');$('status').textContent='Scan complete.'}catch(e){$('status').innerHTML='<span class="red">'+e.message+'</span>'}finally{$('scan').disabled=false}}$('scan').onclick=scan;$('reset').onclick=reset;$('ca').onkeydown=e=>e.key==='Enter'&&scan()</script></body></html>
