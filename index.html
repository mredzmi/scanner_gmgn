<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GMGN AI Scanner</title><style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f5f7fb;font-family:Inter,system-ui,sans-serif}main{max-width:760px;margin:auto;padding:28px 18px 60px}.brand{font-size:25px;font-weight:900}.sub,.muted{color:#8992a3}.sub{margin:6px 0 24px}.card{background:#11151d;border:1px solid #242b36;border-radius:18px;padding:18px;margin:14px 0}.row{display:flex;gap:10px}.input{flex:1;background:#0b0e14;border:1px solid #303846;border-radius:12px;color:#fff;padding:14px;font-size:15px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer;background:#fff;color:#090b10}.secondary{width:100%;margin-top:10px;background:#252b35;color:#fff}.btn:disabled{opacity:.5}.score{font-size:58px;font-weight:900}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#252b35;font-weight:800;font-size:12px}.green{color:#72e6a0}.yellow{color:#ffd76a}.red{color:#ff7777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#0b0e14;border-radius:12px;padding:13px}.metric b{display:block;font-size:18px;margin-top:4px}.small{font-size:13px;color:#aab2c0;line-height:1.55}.hidden{display:none}.signal{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #202631}.signal:last-child{border:0}.xgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.xbox{background:#0b0e14;border-radius:12px;padding:12px;text-align:center}.xbox b{display:block;font-size:18px;margin-top:4px}@media(max-width:560px){.row{flex-direction:column}.xgrid{grid-template-columns:1fr 1fr}}</style></head><body><main><div class="brand">⚡ GMGN AI Scanner</div><div class="sub">Auto-chain token risk & momentum scanner</div><div class="card"><div class="row"><input id="ca" class="input" placeholder="Paste Solana / EVM contract address…" autocomplete="off"><button id="scan" class="btn">Analyse</button></div><div id="status" class="small" style="margin-top:10px"></div></div><div id="result" class="hidden"><div class="card"><div class="muted">AI SCORE</div><div id="score" class="score">—</div><div id="verdict" class="pill">—</div><p id="summary" class="small"></p><button id="reset" class="btn secondary">↻ New Scan / Reset</button></div><div class="card"><div class="grid"><div class="metric"><span class="muted">Chain</span><b id="chain">—</b></div><div class="metric"><span class="muted">Market Cap</span><b id="mc">—</b></div><div class="metric"><span class="muted">Liquidity</span><b id="liq">—</b></div><div class="metric"><span class="muted">Volume 24H</span><b id="vol">—</b></div><div class="metric"><span class="muted">Price 24H</span><b id="chg">—</b></div><div class="metric"><span class="muted">Pair</span><b id="pair">—</b></div></div></div><div class="card"><h3 style="margin-top:0">🚀 Pump Potential</h3><div id="pump" class="small"></div><div class="xgrid" style="margin-top:12px"><div class="xbox"><span class="muted">2X</span><b id="x2">—</b></div><div class="xbox"><span class="muted">5X</span><b id="x5">—</b></div><div class="xbox"><span class="muted">10X</span><b id="x10">—</b></div><div class="xbox"><span class="muted">20X</span><b id="x20">—</b></div></div></div><div class="card"><h3 style="margin-top:0">Signal breakdown</h3><div id="signals"></div></div><div class="card"><h3 style="margin-top:0">Risk notes</h3><div id="risks" class="small"></div></div></div></main><script>const $=id=>document.getElementById(id);const fmt=n=>{if(n==null||!isFinite(n))return'—';if(Math.abs(n)>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(Math.abs(n)>=1e6)return'$'+(n/1e6).toFixed(2)+'M';if(Math.abs(n)>=1e3)return'$'+(n/1e3).toFixed(1)+'K';return'$'+n.toFixed(2)};const chainName=x=>({solana:'Solana',ethereum:'Ethereum',bsc:'BNB Chain',base:'Base',arbitrum:'Arbitrum',polygon:'Polygon',avalanche:'Avalanche',optimism:'Optimism',hyperliquid:'HyperEVM',sui:'Sui'}[x]||x||'Unknown');const mcFmt=fmt;function kind(a){if(/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a))return'solana';if(/^0x[a-fA-F0-9]{40}$/.test(a))return'evm';return'bad'}function reset(){$('ca').value='';$('status').textContent='';$('result').classList.add('hidden');$('ca').focus();window.scrollTo({top:0,behavior:'smooth'})}function calc(p,pairs){let l=p.liquidity?.usd||0,v=p.volume?.h24||0,c=p.priceChange?.h24||0,b=p.txns?.h24?.buys||0,s=p.txns?.h24?.sells||0,t=b+s;let ls=Math.min(20,l/100000*20),vs=Math.min(20,v/250000*20),bs=t?b/t*20:0,ms=c<=-20?0:c<0?Math.max(0,10+c/2):Math.min(20,10+c/5),ds=pairs.length>=5?20:pairs.length>=3?16:pairs.length>=2?12:7;let score=ls+vs+bs+ms+ds;if(l<10000)score-=12;else if(l<25000)score-=6;if(v<10000)score-=10;if(t&&s>b*1.5)score-=8;if(c>100)score-=5;return{score:Math.round(Math.max(0,Math.min(100,score))),ls,vs,bs,ms,ds}}async function scan(){let a=$('ca').value.trim(),k=kind(a);$('result').classList.add('hidden');if(k==='bad'){$('status').innerHTML='<span class="red">Enter a valid Solana or EVM contract address.</span>';return}$('scan').disabled=true;$('status').textContent='Detecting chain and fetching live market data…';try{let r=await fetch('https://api.dexscreener.com/latest/dex/tokens/'+encodeURIComponent(a));if(!r.ok)throw Error('Market API error');let d=await r.json(),pairs=(d.pairs||[]);if(k==='solana')pairs=pairs.filter(p=>p.chainId==='solana');if(!pairs.length)throw Error('No supported trading pair found. Token may be too new or unsupported.');pairs.sort((a,b)=>(b.liquidity?.usd||0)-(a.liquidity?.usd||0));let p=pairs[0],q=calc(p,pairs),l=p.liquidity?.usd||0,v=p.volume?.h24||0,c=p.priceChange?.h24||0,b=p.txns?.h24?.buys||0,s=p.txns?.h24?.sells||0,risks=[];if(l<10000)risks.push('Very low liquidity — exits may be difficult.');else if(l<25000)risks.push('Low liquidity.');if(v<10000)risks.push('Very low 24H volume.');if(Math.abs(c)>80)risks.push('Extreme 24H price movement.');if(s>b*1.5&&b+s)risks.push('Sell pressure materially exceeds buys.');if(!risks.length)risks.push('No obvious market-structure warning from available market data.');let score=q.score,pot=Math.max(0,Math.min(100,score-(l<25000?10:0)-(v<50000?10:0)-(c>50?8:0))),verdict=score>=85?'STRONG SETUP':score>=75?'GOOD SETUP':score>=60?'WATCH':score>=40?'HIGH RISK':'AVOID';$('score').textContent=score;$('score').className='score '+(score>=75?'green':score>=60?'yellow':'red');$('verdict').textContent=verdict;$('verdict').className='pill '+(score>=75?'green':score>=40?'yellow':'red');$('chain').textContent=chainName(p.chainId);$('mc').textContent=fmt(p.marketCap||p.fdv);$('liq').textContent=fmt(l);$('vol').textContent=fmt(v);$('chg').textContent=c.toFixed(1)+'%';$('pair').textContent=(p.baseToken?.symbol||'?')+'/'+(p.quoteToken?.symbol||'?');$('summary').textContent=`${p.baseToken?.name||'Token'} (${p.baseToken?.symbol||'?'}) on ${chainName(p.chainId)}. Screening uses live market data; it is not financial advice.`;$('pump').innerHTML=`<b>${pot>=80?'🔥 High':pot>=65?'🟡 Moderate':'🔴 Low'} potential</b> — ${pot}/100. X values are market-cap scenarios, not predictions.`;let m=p.marketCap||p.fdv||0;[['x2',2],['x5',5],['x10',10],['x20',20]].forEach(([id,x])=>$(id).textContent=m?mcFmt(m*x):'—');$('signals').innerHTML=[['Liquidity',q.ls,l>=25000?'Healthy':'Weak'],['Volume',q.vs,v>=50000?'Active':'Thin'],['Buy pressure',q.bs,b>=s?'Positive':'Negative'],['Momentum',q.ms,c>0?'Positive':'Negative'],['Market depth',q.ds,pairs.length>=3?'Multiple pairs':'Limited pairs']].map(x=>`<div class="signal"><span>${x[0]}<br><span class="muted">${x[2]}</span></span><b>${Math.round(x[1])}/20</b></div>`).join('');$('risks').innerHTML=risks.map(x=>'• '+x).join('<br>');$('result').classList.remove('hidden');$('status').textContent='Live scan complete.'}catch(e){$('status').innerHTML='<span class="red">'+e.message+'</span>'}finally{$('scan').disabled=false}}$('scan').onclick=scan;$('reset').onclick=reset;$('ca').addEventListener('keydown',e=>{if(e.key==='Enter')scan()});</script></body></html>
